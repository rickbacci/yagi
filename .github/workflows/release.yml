name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag has to match manifest.json
        run: python3 scripts/check-release-tag.py
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')"
          python3 scripts/check-release-tag.py --notes > /tmp/yagi-notes.md
          gh release create "v${version}" --title "Yagi ${version}" --notes-file /tmp/yagi-notes.md
